name: Pre-release

on:
  push:
    tags:
      # alpha/beta only: packager itself reads "alpha"/"beta" out of the tag
      # name to decide the GitHub release's prerelease flag (and, later, the
      # CurseForge release channel), so tags need one of those words in them
      # to get that treatment. Anything else (e.g. -rc.1) would still build
      # and publish here, just without that automatic classification.
      - "v[0-9]+.[0-9]+.[0-9]+-alpha*"
      - "v[0-9]+.[0-9]+.[0-9]+-beta*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No CF_API_KEY here, deliberately -- this channel only ever attaches a
      # build to a GitHub release plus, if configured, WoWInterface/Wago.
      # If release.yml gains CurseForge publishing later, this job still
      # won't touch it, since packager only uploads to a destination when
      # its token env var is present.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Verify archive layout
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'Incognito/Incognito.toc'
          unzip -l "$zip" | grep -q 'Incognito/Core.lua'
          unzip -l "$zip" | grep -q 'Incognito/ChatFilter.lua'
          unzip -l "$zip" | grep -q 'Incognito/Logic.lua'
          unzip -l "$zip" | grep -q 'Incognito/Options.lua'
          unzip -l "$zip" | grep -q 'Incognito/Locale_enUS.lua'
          unzip -l "$zip" | grep -q 'Incognito/embeds.xml'
          unzip -l "$zip" | grep -q 'Incognito/CHANGELOG.md'
          unzip -l "$zip" | grep -q 'Incognito/Libs/AceAddon-3.0'

          if unzip -l "$zip" | grep -q 'Incognito/Tests/'; then
            echo "Tests/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
